<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orb Garden — a tiny game, day one and day seven</title>
<style>
  html, body { margin: 0; padding: 0; background: #f6ead6; }
  body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'DejaVu Sans', sans-serif; }
  #head { height: 190px; padding: 34px 48px 0 48px; box-sizing: border-box; }
  #title { font-size: 84px; font-weight: 900; letter-spacing: 2px; color: #23401f; line-height: 1; }
  #sub { font-size: 34px; color: #6b5a3e; margin-top: 10px; }
  #badge {
    float: right; margin-top: 8px; font-size: 44px; font-weight: 900; color: #fff;
    background: #b3402e; border-radius: 14px; padding: 12px 26px; letter-spacing: 1px;
  }
  #badge.v7 { background: #1f6f3a; }
  #stage { width: 1080px; height: 1080px; display: block; }
  #cap { height: 250px; padding: 30px 48px 0 48px; box-sizing: border-box; }
  #capline { font-size: 40px; font-weight: 700; color: #23401f; line-height: 1.35; }
  #capsub { font-size: 32px; color: #6b5a3e; margin-top: 12px; }
  #foot {
    height: 400px; padding: 40px 48px 0 48px; box-sizing: border-box;
    background: linear-gradient(#f6ead6, #e8d3a8); color: #8a744e; font-size: 30px;
  }
  #foot b { color: #23401f; }
</style>
</head>
<body>
<div id="head">
  <span id="badge">DAY ONE</span>
  <div id="title">ORB GARDEN</div>
  <div id="sub">a tiny game, built by an AI agent</div>
</div>
<canvas id="stage" width="720" height="720"></canvas>
<div id="cap">
  <div id="capline">Day one: one orb, one job — catch them.</div>
  <div id="capsub">Same garden. Same gardener. Watch what a week does.</div>
</div>
<div id="foot">Built by an AI agent &nbsp;·&nbsp; <b>make.fun</b></div>
<script>
'use strict';
// Orb Garden: a fixed-arena catcher. One file, two builds:
//   ?v=1  day one  — one orb type, slow, plain, score only.
//   ?v=7  day seven — same map, same start, same orb schedule,
//         plus colour orbs, bees, a magnet power-up, particles,
//         combos, blooming flowers, clouds, sun and a full HUD.
// ?demo=1 runs the sim on a fixed 1/60 clock with a scripted
// gardener, so both builds play the identical moment identically.
const params = new URLSearchParams(location.search);
const V7 = params.get('v') === '7';
const DEMO = params.get('demo') === '1';

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const W = 720, H = 720;
const GROUND = 640;

if (V7) {
  document.getElementById('badge').textContent = 'DAY SEVEN';
  document.getElementById('badge').classList.add('v7');
  document.getElementById('capline').textContent =
    'Day seven: new orbs, bees, power-ups, combos — same garden.';
  document.getElementById('capsub').textContent =
    'One week of daily updates. Same map, same start.';
}

// --- deterministic RNG (mulberry32) ---
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rngOrb = mulberry32(7);    // orb schedule — identical in both builds
const rngFx = mulberry32(99);    // day-seven extras only

// --- state ---
const S = {
  frame: 0, t: 0, score: 0, combo: 0, comboT: 0, hearts: 3,
  magnetT: 0, collected: 0,
  player: { x: 360, y: GROUND - 26, r: 26, face: 1 },
  orbs: [], bees: [], parts: [], flowers: [], powers: [],
  nextOrb: 0.2, nextPower: 4.5, nextBee: 2.0,
  clouds: [],
};
for (let i = 0; i < 4; i++) S.clouds.push({ x: rngFx() * W, y: 40 + rngFx() * 120, s: 0.6 + rngFx() * 0.7 });

const ORB_COLORS = ['#3fae5a', '#3f7fd0', '#e8b93b']; // green 1, blue 2, gold 5
const ORB_VALUES = [1, 2, 5];

function spawnOrb() {
  const x = 40 + rngOrb() * (W - 80);
  const kind = V7 ? (S.collected % 5 === 4 ? 2 : (rngOrb() < 0.5 ? 0 : 1)) : 0;
  S.orbs.push({ x, y: -18, r: 15, vy: V7 ? 260 : 200, kind, wob: rngOrb() * 6.28 });
}
function spawnBee() {
  const dir = rngFx() < 0.5 ? 1 : -1;
  S.bees.push({
    x: dir > 0 ? -30 : W + 30, y: 400 + rngFx() * 100, vx: dir * (120 + rngFx() * 60),
    ph: rngFx() * 6.28, r: 14,
  });
}
function spawnPower() {
  S.powers.push({ x: 60 + rngFx() * (W - 120), y: -18, r: 16, vy: 110 });
}
function burst(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const a = rngFx() * 6.283, sp = 60 + rngFx() * 140;
    S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 0.5 + rngFx() * 0.3, color });
  }
}

function step(dt) {
  S.frame++; S.t += dt;
  if (S.comboT > 0) { S.comboT -= dt; if (S.comboT <= 0) S.combo = 0; }
  if (S.magnetT > 0) S.magnetT -= dt;

  // spawns — same schedule in both builds (rngOrb untouched by day-7 extras)
  if (S.t >= S.nextOrb) { spawnOrb(); S.nextOrb = S.t + 0.8; }
  if (V7) {
    if (S.t >= S.nextPower) { spawnPower(); S.nextPower = S.t + 4.5; }
    if (S.t >= S.nextBee) { spawnBee(); S.nextBee = S.t + 3.2; }
  }

  // gardener AI: chase the lowest falling orb; dodge bees that get close
  const p = S.player;
  let target = null;
  for (const o of S.orbs) if (!target || o.y > target.y) target = o;
  let move = 0;
  if (target) move = Math.sign(target.x - p.x);
  if (V7) {
    for (const b of S.bees) {
      if (Math.abs(b.x - p.x) < 80 && Math.abs(b.y - p.y) < 60) {
        move = b.x < p.x ? 1 : -1; // sidestep away from the bee
      }
    }
  }
  if (move !== 0) p.face = move;
  p.x += move * (V7 ? 340 : 300) * dt;
  p.x = Math.max(30, Math.min(W - 30, p.x));

  // orbs fall; magnet pulls them in (day seven)
  for (const o of S.orbs) {
    o.y += o.vy * dt; o.wob += dt * 3;
    o.x += Math.sin(o.wob) * 12 * dt;
    if (V7 && S.magnetT > 0) {
      const dx = p.x - o.x, dy = p.y - o.y, d = Math.hypot(dx, dy);
      if (d < 170 && d > 1) { o.x += (dx / d) * 190 * dt; o.y += (dy / d) * 190 * dt; }
    }
    const dx = o.x - p.x, dy = o.y - p.y;
    if (dx * dx + dy * dy < (p.r + o.r) * (p.r + o.r)) {
      o.dead = true; S.collected++;
      const val = V7 ? ORB_VALUES[o.kind] : 1;
      if (V7) {
        S.combo = S.comboT > 0 ? S.combo + 1 : 1; S.comboT = 1.5;
        const mult = Math.min(S.combo, 5);
        S.score += val * mult;
        burst(o.x, o.y, ORB_COLORS[o.kind]);
        S.flowers.push({ x: o.x, c: ORB_COLORS[o.kind], s: 0 });
      } else {
        S.score += val;
      }
    }
    if (o.y > H + 30) o.dead = true;
  }
  S.orbs = S.orbs.filter((o) => !o.dead);

  // power-ups
  for (const pw of S.powers) {
    pw.y += pw.vy * dt;
    const dx = pw.x - p.x, dy = pw.y - p.y;
    if (dx * dx + dy * dy < (p.r + pw.r) * (p.r + pw.r)) { pw.dead = true; S.magnetT = 4; }
    if (pw.y > H + 30) pw.dead = true;
  }
  S.powers = S.powers.filter((pw) => !pw.dead);

  // bees
  for (const b of S.bees) {
    b.x += b.vx * dt; b.ph += dt * 6;
    b.y += Math.sin(b.ph) * 22 * dt;
    const dx = b.x - p.x, dy = b.y - p.y;
    if (V7 && dx * dx + dy * dy < (p.r + b.r) * (p.r + b.r) && S.hearts > 0) {
      S.hearts--; b.dead = true; S.combo = 0; S.comboT = 0;
    }
    if (b.x < -60 || b.x > W + 60) b.dead = true;
  }
  S.bees = S.bees.filter((b) => !b.dead);

  // particles + flowers
  for (const pt of S.parts) { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 220 * dt; pt.life -= dt; }
  S.parts = S.parts.filter((pt) => pt.life > 0);
  for (const f of S.flowers) if (f.s < 1) f.s = Math.min(1, f.s + dt * 2);
  for (const c of S.clouds) { c.x += 8 * dt; if (c.x > W + 80) c.x = -80; }
}

function draw() {
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  if (V7) { sky.addColorStop(0, '#8ec9ee'); sky.addColorStop(0.7, '#cfe9f7'); sky.addColorStop(1, '#f6ead6'); }
  else { sky.addColorStop(0, '#b9c4c9'); sky.addColorStop(1, '#e8e2d2'); }
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  if (V7) {
    // sun
    ctx.fillStyle = '#f7c948';
    ctx.beginPath(); ctx.arc(620, 84, 42, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(247,201,72,0.25)';
    ctx.beginPath(); ctx.arc(620, 84, 62, 0, 6.283); ctx.fill();
    // clouds
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (const c of S.clouds) {
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, 46 * c.s, 18 * c.s, 0, 0, 6.283);
      ctx.ellipse(c.x + 30 * c.s, c.y + 6, 34 * c.s, 14 * c.s, 0, 0, 6.283);
      ctx.fill();
    }
    // hills
    ctx.fillStyle = '#8fb573';
    ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.quadraticCurveTo(180, 560, 360, GROUND);
    ctx.quadraticCurveTo(540, 580, 720, GROUND); ctx.closePath(); ctx.fill();
  }

  // soil
  ctx.fillStyle = V7 ? '#7a5230' : '#8a6a44';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = V7 ? '#6b4526' : '#7a5c38';
  for (let x = 20; x < W; x += 60) { ctx.fillRect(x, GROUND + 26, 26, 6); ctx.fillRect(x + 30, GROUND + 52, 26, 6); }

  // flowers (day seven)
  for (const f of S.flowers) {
    const r = 7 * f.s;
    ctx.strokeStyle = '#2f7a33'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(f.x, GROUND); ctx.lineTo(f.x, GROUND - 22 * f.s); ctx.stroke();
    ctx.fillStyle = f.c;
    for (let k = 0; k < 5; k++) {
      const a = (k / 5) * 6.283;
      ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * r, GROUND - 26 * f.s + Math.sin(a) * r, r * 0.55, 0, 6.283); ctx.fill();
    }
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath(); ctx.arc(f.x, GROUND - 26 * f.s, r * 0.5, 0, 6.283); ctx.fill();
  }

  // power-ups
  for (const pw of S.powers) {
    ctx.fillStyle = '#8d5a2b';
    ctx.beginPath(); ctx.arc(pw.x, pw.y, pw.r, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('M', pw.x, pw.y + 1);
  }

  // orbs
  for (const o of S.orbs) {
    ctx.fillStyle = V7 ? ORB_COLORS[o.kind] : '#3fae5a';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(o.x - 4, o.y - 5, 4.5, 0, 6.283); ctx.fill();
    if (V7 && o.kind === 2) {
      ctx.strokeStyle = '#fff3b0'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r + 4, 0, 6.283); ctx.stroke();
    }
  }

  // bees (day seven)
  for (const b of S.bees) {
    const flap = Math.sin(b.ph * 2) * 6;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.ellipse(b.x - 6, b.y - 10 - flap, 10, 5, -0.5, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(b.x + 6, b.y - 10 + flap, 10, 5, 0.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#f2b705';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.fillRect(b.x - 8, b.y - 6, 4, 12); ctx.fillRect(b.x + 2, b.y - 6, 4, 12);
  }

  // particles
  for (const pt of S.parts) {
    ctx.globalAlpha = Math.max(0, pt.life * 2);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // gardener
  const p = S.player;
  ctx.fillStyle = '#2b5ea7'; // overalls
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#f2c89b'; // head
  ctx.beginPath(); ctx.arc(p.x, p.y - 20, 15, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#e8b93b'; // straw hat
  ctx.beginPath(); ctx.ellipse(p.x, p.y - 30, 24, 7, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x, p.y - 32, 12, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#222'; // eyes
  ctx.beginPath(); ctx.arc(p.x + p.face * 5, p.y - 21, 2.2, 0, 6.283); ctx.fill();
  if (V7 && S.magnetT > 0) {
    ctx.strokeStyle = 'rgba(232,185,59,0.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y - 8, 44, 0, 6.283); ctx.stroke();
  }

  // HUD
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(20,40,20,0.55)';
  ctx.fillRect(16, 16, 250, 64);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 34px sans-serif';
  ctx.fillText('SCORE ' + S.score, 30, 60);
  if (V7) {
    ctx.fillStyle = 'rgba(20,40,20,0.55)';
    ctx.fillRect(W - 266, 16, 250, 64);
    ctx.fillStyle = '#ff5b5b'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('♥'.repeat(S.hearts) + '♡'.repeat(3 - S.hearts), W - 30, 58);
    ctx.textAlign = 'left';
    if (S.combo >= 2) {
      ctx.fillStyle = '#e8b93b'; ctx.font = 'bold 36px sans-serif';
      ctx.fillText('COMBO x' + Math.min(S.combo, 5), 30, 116);
    }
    if (S.magnetT > 0) {
      ctx.fillStyle = '#fff'; ctx.font = 'bold 26px sans-serif';
      ctx.fillText('MAGNET!', 30, 152);
    }
  }
}

let last = 0;
function tick(ts) {
  if (DEMO) {
    step(1 / 60);
  } else {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
    last = ts; step(dt);
  }
  draw();
  window.__game = { frame: S.frame, t: +S.t.toFixed(2), score: S.score, orbs: S.orbs.length };
  window.__shotReady = true;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
